<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEGACY</title>
<style>
body{margin:0;background:#060607;color:#f3f2ef;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
h1{font-size:18px;font-weight:600;margin:0 0 8px}p{color:#9b9aa1;margin:0}a{color:#ff3b3b}
</style>
</head>
<body>
<div id="m"><h1>Un instant…</h1><p>On t'emmène vers la vidéo.</p></div>
<script>
// Liens /go/<vidéo> : compte le clic puis envoie vers la page « Prépare ta perf ». Toute autre adresse = page introuvable.
(function(){
  const C={url:"https://cocydoftuehajzqwvbge.supabase.co",key:"sb_publishable_5AUQtgQPiiJNCB0n9Sh9NA_hYp_gwxk"};
  const m=location.pathname.match(/\/legacy-coaching\/go\/([a-z0-9_-]{1,40})\/?$/i);
  if(!m){document.getElementById('m').innerHTML='<h1>Page introuvable</h1><p>Cette adresse n\'existe pas. <a href="/legacy-coaching/">Retour à LEGACY</a></p>';return}
  const slug=m[1].toLowerCase();
  const dest='/legacy-coaching/prepa/?v='+encodeURIComponent(slug);
  const t=setTimeout(()=>location.replace(dest),1200);
  fetch(C.url+'/rest/v1/clics',{method:'POST',keepalive:true,headers:{'apikey':C.key,'Authorization':'Bearer '+C.key,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({slug,ua:navigator.userAgent.slice(0,200),ref:document.referrer.slice(0,200)})})
    .finally(()=>{clearTimeout(t);location.replace(dest)});
})();
</script>
</body>
</html>
