<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>LEGACY · Vue coach</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b; --bg-2:#111113; --card:#151517; --card-2:#1b1b1e; --line:rgba(255,255,255,.09);
    --grey-1:#e7e8ec; --grey-2:#8a8b91; --grey-3:#5c5d63;
    --blood:#ff3b3b; --ok:#4ade80; --or:#ffc740; --amber:#ffa53b;
    --stripes:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0px,rgba(255,255,255,.03) 1px,transparent 1px,transparent 16px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{color:var(--grey-1);font-family:'Inter',system-ui,sans-serif;line-height:1.45;background-image:var(--stripes);
    -webkit-font-smoothing:antialiased;min-height:100vh;}
  button,input{font:inherit;color:inherit;background:none;border:none;}
  button{cursor:pointer;}
  .u{font-family:'Unbounded',sans-serif;}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px 60px;}

  /* haut */
  /* barre du haut toujours visible : « ‹ Athlètes » reste touchable même en bas de la fiche */
  .top{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;
    height:50px;box-sizing:border-box;margin:0 -16px;padding:8px 16px;background:rgba(10,10,11,.9);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .top .mark{margin-left:auto;}
  .top .bloupe{margin-left:0;width:30px;height:30px;}
  .back{display:flex;align-items:center;gap:6px;color:var(--grey-2);font-size:13px;font-weight:600;
    padding:10px 12px 10px 0;margin:-10px 0;}
  .mark{font-family:'Unbounded';font-weight:900;font-size:13px;letter-spacing:1px;}
  .mark span{color:var(--blood);}
  .hero{padding:18px 0 14px;position:relative;}
  .hero:before{content:'';position:absolute;inset:-20px -16px auto;height:160px;z-index:-1;
    background:radial-gradient(60% 70% at 30% 0%,rgba(255,59,59,.16),transparent 70%);}
  .hero h1{font-family:'Unbounded';font-weight:900;font-size:30px;letter-spacing:.5px;text-transform:uppercase;line-height:1.05;}
  .hero .meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;}
  .pill{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--grey-2);}
  .pill.red{color:#fff;background:var(--blood);border-color:var(--blood);}

  /* onglets */
  .tabs{position:sticky;top:50px;z-index:5;margin:0 -16px;padding:10px 16px;background:rgba(10,10,11,.88);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;}
  .seg{position:relative;}
  .seg .ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / 3);border-radius:9px;background:var(--grey-1);
    transition:transform .3s cubic-bezier(.3,.8,.3,1);}
  .seg button{position:relative;z-index:1;padding:9px 0;border-radius:9px;font-size:13px;font-weight:700;color:var(--grey-2);transition:color .25s;}
  .seg button.on{color:var(--bg);}
  .vue{display:none;padding-top:16px;}
  .vue.on{display:block;}

  .h2{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px;}
  .h2 b{font-family:'Unbounded';font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--grey-2);}
  .h2 span{font-size:12px;color:var(--grey-3);}

  /* semaine */
  .wnav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;}
  .wnav button{width:40px;height:40px;border-radius:10px;font-size:20px;color:var(--grey-2);}
  .wnav button:disabled{opacity:.25;}
  .wnav .t{text-align:center;}
  .wnav .t b{display:block;font-family:'Unbounded';font-weight:800;font-size:15px;}
  .wnav .t span{font-size:12px;color:var(--grey-2);}
  .jours{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
  .jour{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;}
  .jour b{display:block;font-size:13px;font-weight:800;}
  .jour span{display:block;font-size:11px;color:var(--grey-3);}
  .jour i{display:inline-block;margin-top:6px;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:999px;}
  .st-faite i{background:rgba(74,222,128,.14);color:var(--ok);}
  .st-avenir i{background:rgba(255,255,255,.06);color:var(--grey-2);}
  .st-manquee i{background:rgba(255,59,59,.14);color:var(--blood);}

  .seance{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;}
  .sh{width:100%;display:flex;align-items:center;gap:10px;padding:14px 14px;text-align:left;}
  .sh .tt{flex:1;min-width:0;}
  .sh .tt b{font-family:'Unbounded';font-weight:800;font-size:15px;}
  .sh .tt span{display:block;font-size:12px;color:var(--grey-2);}
  .tag{font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;}
  .tag.faite{background:rgba(74,222,128,.14);color:var(--ok);}
  .tag.avenir{background:rgba(255,255,255,.06);color:var(--grey-2);}
  .tag.manquee{background:rgba(255,59,59,.14);color:var(--blood);}
  .chev{color:var(--grey-3);transition:transform .2s;font-size:14px;}
  .seance.open .chev{transform:rotate(90deg);}
  .sb{display:none;border-top:1px solid var(--line);}
  .seance.open .sb{display:block;}

  .ex{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;padding:12px 14px 12px 0;border-bottom:1px solid var(--line);}
  .ex:last-child{border-bottom:none;}
  .ex .bar{border-radius:0 4px 4px 0;}
  .ex .n b{font-weight:700;font-size:14.5px;text-transform:capitalize;}
  .ex .n em{font-style:normal;color:var(--grey-2);font-size:12.5px;}
  .ex .sr{font-size:12.5px;color:var(--grey-2);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .ex .c{text-align:right;font-family:'Unbounded';font-weight:800;font-size:17px;white-space:nowrap;padding-top:1px;}
  .ex .c small{font-family:'Inter';font-size:11px;font-weight:600;color:var(--grey-2);margin-left:2px;}
  .ex .c.vide{color:var(--grey-3);}
  .rpe{display:inline-flex;align-items:center;gap:4px;font-weight:700;}
  .rpe i{font-style:normal;font-size:12px;font-weight:800;padding:1px 6px;border-radius:6px;}
  .r-lo{background:rgba(74,222,128,.14);color:var(--ok);}
  .r-mid{background:rgba(255,165,59,.15);color:var(--amber);}
  .r-hi{background:rgba(255,59,59,.16);color:var(--blood);}
  .r-no{background:rgba(255,255,255,.05);color:var(--grey-3);}
  .pr{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--or);color:#1a1300;}
  /* notes en gris clair neutre : l'or est réservé aux records */
  .bnote{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;
    background:rgba(255,255,255,.08);color:#d4d6dc;}
  .bnote span{display:inline-block;transition:transform .2s;}
  .ex.vnote .bnote span{transform:rotate(90deg);}
  .note{display:none;}
  .ex.vnote .note{display:block;}
  .note{grid-column:2 / 4;margin-top:9px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.045);
    border-left:3px solid rgba(255,255,255,.35);font-size:13px;color:#e2e3e8;line-height:1.45;}
  .note:before{content:'Note';display:block;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--grey-2);margin-bottom:2px;}

  .recup{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .rc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;}
  .rc b{display:block;font-family:'Unbounded';font-weight:800;font-size:18px;}
  .rc span{font-size:10.5px;color:var(--grey-2);}
  .rc.vide b{color:var(--grey-3);}

  /* graphiques */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;}
  .ct{display:flex;justify-content:space-between;align-items:baseline;}
  .ct b{font-family:'Unbounded';font-weight:800;font-size:14px;}
  .ct span{font-size:11.5px;color:var(--grey-3);}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 4px;}
  .chip{font-size:11.5px;font-weight:700;padding:6px 9px;white-space:nowrap;border-radius:999px;border:1px solid var(--line);color:var(--grey-2);display:flex;align-items:center;gap:6px;}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--c);}
  .chip.on{background:rgba(255,255,255,.08);color:var(--grey-1);border-color:rgba(255,255,255,.2);}
  .chip.off{opacity:.45;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
  .stat{background:var(--bg-2);border-radius:10px;padding:8px 10px;}
  .stat span{display:block;font-size:10.5px;color:var(--grey-3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .stat b{font-family:'Unbounded';font-weight:800;font-size:15px;}
  .stat b.up{color:var(--ok);} .stat b.down{color:var(--blood);}
  .periode{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;}
  .periode button{font-size:12px;font-weight:700;color:var(--grey-2);padding:8px 0;border-radius:9px;}
  .periode button.on{background:rgba(255,255,255,.1);color:var(--grey-1);}
  .mini{display:inline-flex;margin-top:10px;background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:2px;}
  .mini button{font-size:11.5px;font-weight:700;color:var(--grey-2);padding:5px 12px;border-radius:7px;}
  .mini button.on{background:var(--grey-1);color:var(--bg);}
  .plotwrap{position:relative;}
  .zoom{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:6px;}
  .zoom span{flex:1;font-size:10.5px;color:var(--grey-3);}
  .zoom button{min-width:30px;height:28px;padding:0 9px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);font-size:14px;font-weight:800;color:var(--grey-1);}
  .defile{touch-action:pan-x;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .defile::-webkit-scrollbar{display:none;}
  .defile svg{max-width:none;}
  .axe{position:absolute;left:0;top:0;width:30px;background:linear-gradient(90deg,var(--card) 75%,transparent);pointer-events:none;}
  .tab-st{margin-top:10px;background:var(--bg-2);border-radius:10px;padding:4px 10px;}
  .st-l{display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px;}
  .st-l:first-child{border-top:none;}
  .st-l span{text-align:right;font-family:'Unbounded';font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;}
  .st-l span:first-child{text-align:left;font-family:'Inter';font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .st-l span:first-child i{width:8px;height:8px;border-radius:50%;flex:none;}
  .st-l .up{color:var(--ok);} .st-l .down{color:var(--blood);}
  .st-h span{font-family:'Inter' !important;font-size:10px !important;font-weight:700 !important;color:var(--grey-3);text-transform:uppercase;letter-spacing:.4px;}
  svg{display:block;width:100%;height:auto;overflow:visible;}
  .tip{margin-top:8px;background:var(--bg-2);border-radius:10px;padding:8px 10px;}
  .tip-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .tip-h b{font-size:12px;font-weight:800;}
  .tip-h span{font-size:10.5px;color:var(--grey-3);}
  .tip-v{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-size:12px;color:var(--grey-2);}
  .tip-v span{display:inline-flex;align-items:center;gap:5px;}
  .tip-v i{width:7px;height:7px;border-radius:50%;}
  .tip-v b{color:var(--grey-1);font-variant-numeric:tabular-nums;}

  /* records */
  .search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;outline:none;}
  .search:focus{border-color:rgba(255,59,59,.5);}
  .filt{display:flex;gap:6px;margin:0 0 2px;flex-wrap:wrap;align-items:center;}
  .bloupe{margin-left:auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);color:var(--grey-2);}
  .cherche{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--card);border:1px solid rgba(255,59,59,.45);border-radius:12px;padding:0 6px 0 12px;}
  .cherche span{color:var(--grey-2);display:flex;}
  .cherche input{flex:1;min-width:0;padding:11px 0;font-size:14px;outline:none;}
  .cherche button{width:30px;height:30px;color:var(--grey-2);font-size:13px;}
  .princ{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .mp{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;position:relative;overflow:hidden;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 11px;}
  .mp:before{content:'';position:absolute;inset:0;background:radial-gradient(90% 80% at 0% 0%,var(--c),transparent 70%);opacity:.16;}
  .mp:after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);}
  .mp b{position:relative;display:block;font-family:'Unbounded';font-weight:800;font-size:13px;color:var(--c);text-transform:uppercase;letter-spacing:.3px;}
  .mp .big{position:relative;display:block;font-family:'Unbounded';font-weight:800;font-size:19px;color:var(--grey-1);margin-top:6px;}
  .mp .big small{font-family:'Inter';font-size:11px;color:var(--grey-2);font-weight:600;margin-left:4px;display:inline-block;white-space:nowrap;}
  .mp span{position:relative;display:block;font-size:11.5px;color:var(--grey-2);}
  .mp span em{font-style:normal;color:var(--or);font-weight:700;}
  .mp.on{border-color:var(--c);}
  .mp .sch{font-size:11.5px;font-weight:600;color:var(--grey-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mp.vide{opacity:.55;}
  .mp.vide .big{color:var(--grey-3);}
  .detail{margin-top:8px;background:var(--card);border:1px solid var(--c);border-radius:14px;overflow:hidden;}
  .detail .dh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;}
  .detail .dh b{font-family:'Unbounded';font-weight:800;font-size:14px;color:var(--c);text-transform:uppercase;}
  .detail .dh button{color:var(--grey-2);font-size:12px;font-weight:700;}
  .fmt{padding:7px 14px 5px;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--grey-3);background:var(--bg-2);border-top:1px solid var(--line);}
  .grp{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .grp .gh{width:100%;display:flex;align-items:center;gap:12px;padding:14px;text-align:left;}
  .grp .gh .tt{flex:1;}
  .grp .gh .tt b{display:block;font-family:'Unbounded';font-weight:800;font-size:13px;letter-spacing:.3px;}
  .grp .gh .tt span{font-size:12px;color:var(--grey-3);}
  .grp .gh .tt span em{font-style:normal;color:var(--or);font-weight:700;}
  .grp .gb{display:none;border-top:1px solid var(--line);padding:8px;}
  .grp.open{border-color:rgba(255,255,255,.22);}
  .grp.open .gb{display:block;}
  .grp.open > .gh .chev{transform:rotate(90deg);}
  .rex{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;overflow:hidden;}
  .rex:last-child{margin-bottom:0;}
  .rex .rh{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 12px;text-align:left;}
  .rex .rh b{font-weight:700;font-size:14px;}
  .rex .rh span{font-size:11.5px;color:var(--grey-3);}
  .rex.open .rh .chev{transform:rotate(90deg);}
  .rrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:13px;}
  .rrow .f{color:var(--grey-2);}
  .rrow .f b{color:var(--grey-1);font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums;}
  .rrow .v{font-family:'Unbounded';font-weight:800;font-size:13px;}
  .rrow .d{font-size:11.5px;color:var(--grey-3);width:44px;text-align:right;font-variant-numeric:tabular-nums;}
  .rrow.new{background:rgba(255,199,64,.07);}
  .rrow.new .d{color:var(--or);font-weight:700;}
  .rows{display:none;} .rex.open .rows{display:block;}
  .classer{padding:0 12px 10px;}
  .bclasser{font-size:11.5px;font-weight:700;color:var(--grey-2);padding:4px 10px;border-radius:999px;border:1px dashed rgba(255,255,255,.2);}
  .cats{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;transition:all .25s;background:var(--grey-1);color:var(--bg);
    font-weight:700;font-size:13px;padding:10px 16px;border-radius:999px;z-index:20;white-space:nowrap;}
  .toast.on{transform:translate(-50%,0);opacity:1;}
  .vide-msg{color:var(--grey-3);font-size:13px;text-align:center;padding:30px 0;}
  .maquette{margin-top:26px;font-size:11.5px;color:var(--grey-3);text-align:center;}

  /* ---------- ajouts v2 ---------- */
  .ecran{display:none;} .ecran.on{display:block;}
  /* liste des athlètes */
  .liste-h{padding:26px 0 8px;}
  .liste-h h1{font-family:'Unbounded';font-weight:900;font-size:26px;text-transform:uppercase;}
  .ath{position:relative;width:100%;text-align:left;display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;overflow:hidden;}
  .ath:active{transform:scale(.99);}
  .ath .l1{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .ath .l1 b{font-family:'Unbounded';font-weight:800;font-size:17px;text-transform:uppercase;}
  .ath .l1 span{font-size:12px;color:var(--grey-2);white-space:nowrap;}
  .dots{display:flex;gap:6px;margin-top:10px;}
  .dots i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);}
  .dots i.faite{background:var(--ok);} .dots i.manquee{background:var(--blood);}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--grey-2);}
  .badge.or{background:rgba(255,199,64,.13);color:var(--or);}
  .badge.rouge{background:rgba(255,59,59,.14);color:var(--blood);}
  .badge.vert{background:rgba(74,222,128,.13);color:var(--ok);}
  /* semaine : repère « en cours » */
  .wnav .t i{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--blood);margin-left:6px;}
  /* RPE prévu contre réel */
  .cible{font-size:11px;font-weight:700;color:var(--grey-3);}
  .cible.plus{color:var(--blood);} .cible.moins{color:#6fa8dc;}
  /* records : silhouettes en filigrane sur les mouvements principaux */
  .mp .sil{position:absolute;right:-6px;bottom:-8px;width:62%;height:92%;background-color:var(--c);opacity:.16;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-position:bottom right;mask-position:bottom right;pointer-events:none;}
  .rrow{cursor:pointer;}
  .rrow .chev{font-size:12px;}
  .rrow.open .chev{transform:rotate(90deg);}
  .histo{padding:6px 14px 10px;border-top:1px solid var(--line);}
  .histo svg{height:auto;}

  .a-rec .mini-sil{width:22px;height:26px;background:linear-gradient(160deg,#fff4cc 0%,#e8c46a 45%,var(--c) 95%);filter:drop-shadow(0 0 4px rgba(232,196,106,.35));}
  .a-rec i{position:absolute;right:-3px;bottom:-2px;font-style:normal;font-size:9px;font-weight:800;color:#1a1300;background:#e8c46a;border-radius:999px;padding:0 4px;line-height:13px;}
  .ath3 .chev{font-size:16px;color:var(--grey-3);}
  @media (prefers-reduced-motion: reduce){ .ath3{animation:none;opacity:1;} }
  .s-pr{font-style:normal;font-weight:800;color:#e8c46a;}
  /* en-tête de fiche en texte simple */
  .hero .meta{align-items:baseline;gap:0;}
  .hero .meta b{font-size:13px;font-weight:800;color:var(--grey-1);}
  .hero .meta span{font-size:13px;font-weight:600;color:var(--grey-2);}
  .hero .meta span:before{content:'·';margin:0 7px;color:var(--grey-3);}
  /* historique d'un exercice ouvert depuis une séance */
  .ex{cursor:pointer;}
  .ex.vhisto{background:rgba(255,255,255,.025);}
  .ex-histo{padding:2px 14px 12px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025);}
  .ex-histo .histo{padding:4px 0 0;border-top:none;}
  /* recherche d'athlète */
  .liste-h{display:flex;align-items:center;justify-content:space-between;}
  .liste-h .bloupe{margin-left:0;width:28px;height:28px;}
  .liste-h .bloupe svg{width:13px;height:13px;}
  .a-cherche{margin:0 0 14px;}
  .aths.sans-anim .ath3{animation:none;opacity:1;}
  .l-boutons{display:flex;gap:6px;align-items:center;}
  .l-boutons .bloupe{width:28px;height:28px;font-size:13px;color:var(--grey-2);}
  .l-boutons .bloupe svg{width:13px;height:13px;}
  .bloupe.tourne{animation:tourne .9s linear infinite;}
  @keyframes tourne{to{transform:rotate(360deg);}}
  /* athlète (lecture seule) : pas d'onglets, seulement ses records */
  .lecture .tabs{display:none;}
  /* modifier un exercice : panneau qui monte du bas (appui long) */
  [data-exo]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
  .edit{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0);pointer-events:none;transition:background .25s;}
  .edit.on{background:rgba(0,0,0,.55);pointer-events:auto;}
  .edit-p{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:82vh;overflow-y:auto;
    background:#141416;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));
    transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);}
  .edit.on .edit-p{transform:none;}
  .ed-poignee{width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 10px;}
  .ed-t{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .ed-t b{flex:1;font-family:'Unbounded';font-weight:800;font-size:16px;}
  .ed-t button{color:var(--grey-2);font-size:15px;padding:6px;}

  .ed-l span{font-weight:600;letter-spacing:0;text-transform:none;color:var(--grey-3,#6b6d75);}
  .edit input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:15px;}
  .ed-note{font-size:12px;color:var(--grey-2);margin-top:7px;}
  .ed-note button{color:var(--grey-1);text-decoration:underline;font-size:12px;padding:0;}

  .ed-cands{display:flex;flex-direction:column;margin-top:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden;}

<style>
/* ===== l'accueil de la vue coach (maquette LEGACY OS, 12/10) ===== */
#cockpit{padding-bottom:110px}
#cockpit .ck-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 0 6px}
#cockpit .ck-h small{display:block;font:600 8.5px var(--os-mono);letter-spacing:.24em;color:var(--os-red)}
#cockpit .ck-h h1{margin:6px 0 0;font:800 32px/1 var(--os-holo);font-variation-settings:"wdth" 116;text-transform:uppercase;letter-spacing:.04em;color:var(--os-data)}
#cockpit .ck-h span{display:block;margin-top:7px;font:500 9px var(--os-mono);letter-spacing:.16em;color:var(--os-dim)}
#cockpit .cherche{margin:10px 0 0}
.ck-sec{display:flex;align-items:baseline;gap:10px;margin:24px 0 6px;font:600 9px var(--os-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--os-dim)}
.ck-sec b{font-weight:600;color:var(--os-data)}
.ck-sec i{font-style:normal;color:var(--os-gold)}
.ck-sec span{letter-spacing:.12em;font-weight:500;color:var(--os-faint)}
.ck-sec::after{content:"";flex:1;height:1px;background:var(--os-line);transform:translateY(-3px)}
.ck-todo{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:16px;margin:10px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.ck-todo::-webkit-scrollbar{display:none}
.ck-t{flex:0 0 auto;scroll-snap-align:start;display:grid;grid-template-columns:auto;align-content:start;gap:6px;width:112px;min-height:86px;padding:12px 12px 12px;text-align:left;background:linear-gradient(180deg,rgba(255,199,64,.07),rgba(255,255,255,.015));border:0;border-top:2px solid var(--os-gold);color:var(--os-data);-webkit-tap-highlight-color:transparent}
.ck-t.c-red{border-top-color:var(--os-red);background:linear-gradient(180deg,rgba(255,59,59,.1),rgba(255,255,255,.015))}
.ck-t b{font:800 26px/1 var(--os-holo);color:var(--os-gold)}
.ck-t.c-red b{color:var(--os-red);text-shadow:0 0 14px rgba(255,59,59,.35)}
.ck-t span{font:600 8px/1.4 var(--os-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--os-dim)}
.ck-t:active{transform:scale(.97)}
.ck-ok{margin:10px 0 0;font:500 13.5px var(--os-holo);color:var(--os-dim)}
.ck-aths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 6px;margin-top:12px}
.ck-a{position:relative;display:grid;justify-items:center;gap:5px;padding:2px 0;background:none;border:0;color:var(--os-data);-webkit-tap-highlight-color:transparent;animation:ckIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 45ms)}
.ck-aths.sans-anim .ck-a{animation:none}
@keyframes ckIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.ck-a svg{width:74px;height:74px;overflow:visible;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.ck-a .seg{fill:none;stroke-width:4.5}
.ck-a .seg.faite{stroke:var(--os-data)}
.ck-a .seg.manquee{stroke:var(--os-red);filter:drop-shadow(0 0 3px rgba(255,59,59,.6))}
.ck-a .seg.avenir{stroke:rgba(233,237,241,.16)}
.ck-a .seg.vide{stroke:rgba(233,237,241,.14);stroke-dasharray:2 4}
.ck-a .cx{font:800 17px var(--os-holo);fill:var(--os-data)}
.ck-a .cx3{font-size:11px;fill:var(--os-dim)}
.ck-a .cx2{font:500 5.5px var(--os-mono);letter-spacing:.18em;fill:var(--os-dim)}
.ck-a b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 12.5px var(--os-holo);font-variation-settings:"wdth" 112;letter-spacing:.12em;text-transform:uppercase}
.ck-a small{font:500 8px var(--os-mono);letter-spacing:.14em;color:var(--os-dim)}
.ck-a .bdg{position:absolute;font-style:normal}
.ck-a .bdg.dl{top:5px;right:calc(50% - 37px);width:11px;height:11px;border-radius:50%;background:var(--os-red);border:2px solid var(--os-void);box-shadow:0 0 10px var(--os-red)}
.ck-a .bdg.pr{top:-2px;left:calc(50% - 41px);font:700 10px var(--os-holo);color:var(--os-gold);text-shadow:0 0 8px rgba(255,199,64,.6)}
.ck-a:active svg{transform:scale(.95)}
.ck-outils{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 4px;margin-top:12px}

.ck-o .ck-i em{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;display:grid;place-items:center;font:700 9px var(--os-holo);font-style:normal;color:#120d02;background:var(--os-gold)}
