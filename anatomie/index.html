<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEGACY Anatomie</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anatomie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Mise en page : scène 3D plein écran ; en haut la marque et les compteurs ; en bas une console type HUD
   (fiche de la structure, modes Muscles / Profond / Squelette, puis sélecteur de style). */
:root {
  --bg: #05070a;
  --ink: #eaf1f7;
  --ink-2: #8d99a8;
  --ink-3: #56606d;
  --line: rgba(160, 220, 255, .14);
  --glass: rgba(8, 12, 18, .66);
  --accent: #58e6ff;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --biseau: 7px;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--display); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#fond { position: fixed; inset: 0; overflow: hidden; transition: background .8s ease; }
body[data-fond="holo"] #fond { background: radial-gradient(120% 80% at 50% 45%, #0b1a26 0%, #05070b 60%, #020305 100%); }
body[data-fond="real"] #fond { background: radial-gradient(110% 80% at 50% 40%, #3a332f 0%, #1b1816 55%, #0c0b0a 100%); }
body[data-fond="neon"] #fond { background: radial-gradient(90% 70% at 50% 50%, #0c1418 0%, #050709 55%, #000 100%); }
body[data-accent="magenta"] { --accent: #ff6be0; }
body[data-accent="cyan"] { --accent: #58e6ff; }
/* Réaliste : identité LEGACY, or + rouge sang, verre chaud */
body[data-accent="or"] { --accent: #e6b35a; --accent-2: #c8332b; --ink: #f4ece2; --ink-2: #a8998a; --ink-3: #6b5f55; --line: rgba(230, 179, 90, .18); --glass: rgba(20, 13, 11, .7); }
body[data-accent="or"] .fiche::before, body[data-accent="or"] .fiche::after { border-color: var(--accent-2); }
body[data-accent="or"] .onglets button[aria-pressed="true"]::before, body[data-accent="or"] .modes button::after { background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
body[data-accent="or"] .panneau { background: rgba(17, 10, 9, .92); box-shadow: 0 -1.5px 0 var(--accent-2), 0 -30px 60px rgba(0,0,0,.45); }
body[data-accent="or"] .ligne-exo, body[data-accent="or"] .ligne-liste { background: rgba(230, 179, 90, .03); }
body[data-accent="or"] .ligne-exo:hover, body[data-accent="or"] .ligne-liste:hover { background: rgba(200, 51, 43, .12); box-shadow: inset 2px 0 0 var(--accent-2), inset 0 -1px 0 var(--line); }
#fNom.frappe::after { content: "▍"; color: var(--accent); margin-left: 2px; animation: clignote .5s steps(1) infinite; }
@keyframes clignote { 50% { opacity: 0; } }
body[data-accent="or"] .intro-marque { text-shadow: 0 0 22px rgba(200, 51, 43, .8), 0 0 4px var(--accent); }
canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---- Haut ---- */
.haut { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; padding: 16px 16px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.gauche { pointer-events: none; }
.marque { font-weight: 800; font-stretch: 125%; letter-spacing: .03em; font-size: 14px; line-height: 1; }
.marque small { display: block; font-family: var(--mono); font-weight: 400; font-stretch: 100%; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); margin-top: 7px; }
.hud-droite { display: flex; gap: 8px; align-items: flex-start; pointer-events: auto; }
.compteurs { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); text-align: right; line-height: 1.6; font-variant-numeric: tabular-nums; }
.compteurs b { color: var(--accent); font-weight: 600; }

/* bouton icône à biseau */
.ico { width: 34px; height: 34px; display: grid; place-items: center; color: var(--ink-2); background: var(--glass); border: 0; cursor: pointer;
  clip-path: polygon(var(--biseau) 0, 100% 0, 100% calc(100% - var(--biseau)), calc(100% - var(--biseau)) 100%, 0 100%, 0 var(--biseau));
  box-shadow: inset 0 0 0 1px var(--line); transition: color .2s, box-shadow .2s; }
.ico svg { width: 16px; height: 16px; }
.ico[aria-pressed="true"] { color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }

/* ---- Bas : console ---- */
.console { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; justify-items: center; pointer-events: none; }
.console > * { pointer-events: auto; }

.fiche { position: relative; width: min(520px, 100%); box-sizing: border-box; background: var(--glass); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
  padding: 13px 16px 14px; display: grid; gap: 3px; transition: opacity .35s ease, transform .35s ease;
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); box-shadow: inset 0 0 0 1px var(--line); }
.fiche::before, .fiche::after { content: ""; position: absolute; width: 14px; height: 14px; border: 1.5px solid var(--accent); opacity: .8; }
.fiche::before { top: 0; left: 0; border-right: 0; border-bottom: 0; transform: translate(0, 0); clip-path: polygon(0 0, 100% 0, 0 100%); }
.fiche::after { bottom: 0; right: 0; border-left: 0; border-top: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
.fiche[data-vide] { opacity: 0; transform: translateY(8px); pointer-events: none; }
.fiche .ligne1 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.fiche .groupe { font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.fiche .tag { font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); padding: 2px 6px; box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.fiche h1 { margin: 2px 0 0; font-size: 21px; font-weight: 750; font-stretch: 86%; line-height: 1.12; text-wrap: balance; }
.fiche .latin { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }

.aide { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); text-align: center; transition: opacity .4s; }

/* modes : barre segmentée fine */
.modes { display: flex; box-shadow: inset 0 0 0 1px var(--line); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  clip-path: polygon(var(--biseau) 0, 100% 0, 100% calc(100% - var(--biseau)), calc(100% - var(--biseau)) 100%, 0 100%, 0 var(--biseau)); }
.modes button { position: relative; font: 500 10.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); background: none; border: 0; padding: 11px 14px 12px; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: color .2s; }
.modes button + button { box-shadow: -1px 0 0 var(--line); }
.modes button svg { width: 17px; height: 17px; opacity: .85; }
.modes button[aria-pressed="true"] svg { opacity: 1; color: var(--accent); filter: drop-shadow(0 0 4px color-mix(in srgb, var(--accent) 60%, transparent)); }
.modes button::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 5px; height: 1.5px; background: var(--accent); box-shadow: 0 0 8px var(--accent); transform: scaleX(0); transition: transform .3s ease; }
.modes button[aria-pressed="true"] { color: var(--ink); }
.modes button[aria-pressed="true"]::after { transform: scaleX(1); }

/* styles : puces compactes avec aperçu */
.styles { display: flex; gap: 6px; }
.styles button { white-space: nowrap; font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); background: none; border: 0; padding: 6px 8px; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: color .2s; }
.styles button i { width: 16px; height: 10px; display: block; clip-path: polygon(3px 0, 100% 0, 100% calc(100% - 3px), calc(100% - 3px) 100%, 0 100%, 0 3px); opacity: .55; transition: opacity .2s; }
.styles button[data-s="net"] i { background: linear-gradient(135deg, #35d8ff, #4f5dff 60%, #ff4fd8); }
.styles button[data-s="realholo"] i { background: linear-gradient(135deg, #c8332b, #6f1618 55%, #e6b35a); }
.styles button[data-s="neon"] i { background: linear-gradient(135deg, #1a1b1e, #0c0d10 60%, #58e6ff); }
.styles button[aria-pressed="true"] { color: var(--ink); }
.styles button[aria-pressed="true"] i { opacity: 1; box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent); }
button:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }

#charge { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); transition: opacity .6s; pointer-events: none; }
#charge[data-fini] { opacity: 0; }
.credit { position: fixed; left: 8px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 8px; color: rgba(255,255,255,.22); pointer-events: none; writing-mode: vertical-rl; rotate: 180deg; }
/* ---- Barre d'onglets ---- */
.couches-zone { width: min(360px, 100%); box-sizing: border-box; display: grid; gap: 6px; padding: 10px 14px 8px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: inset 0 0 0 1px var(--line); clip-path: polygon(var(--biseau) 0, 100% 0, 100% calc(100% - var(--biseau)), calc(100% - var(--biseau)) 100%, 0 100%, 0 var(--biseau)); }
.couches-zone label { display: flex; justify-content: space-between; font: 500 9.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
.couches-zone label b { color: var(--accent); font-weight: 600; }
.couches-zone input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
.couches-zone input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 25%, transparent)); }
.couches-zone input[type=range]::-moz-range-track { height: 2px; background: var(--line); }
.couches-zone input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -8px; background: var(--bg); border: 1.5px solid var(--accent); transform: rotate(45deg); box-shadow: 0 0 10px var(--accent); }
.couches-zone input[type=range]::-moz-range-thumb { width: 16px; height: 16px; background: var(--bg); border: 1.5px solid var(--accent); }
.couches-zone .crans { display: flex; justify-content: space-between; font: 400 9px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.onglets { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 8px env(safe-area-inset-bottom, 0px);
  background: linear-gradient(to top, rgba(4, 6, 9, .96), rgba(4, 6, 9, .82)); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 -1px 0 var(--line); }
.onglets button { position: relative; background: none; border: 0; color: var(--ink-3); padding: 14px 2px 15px; display: grid; place-items: center; cursor: pointer; transition: color .2s; }
.onglets button svg { width: 23px; height: 23px; transition: filter .25s, transform .25s; }
.onglets button[aria-pressed="true"] { color: var(--accent); }
.onglets button[aria-pressed="true"] svg { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 70%, transparent)); transform: translateY(-1px); }
.onglets button[aria-pressed="true"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 1.5px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.console { bottom: calc(52px + env(safe-area-inset-bottom, 0px)) !important; padding-bottom: 10px !important; }
body[data-panneau="mi"] .console, body[data-panneau="plein"] .console { opacity: 0; pointer-events: none; }
.fiche { cursor: pointer; }
.fiche .ouvrir { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-top: 6px; }

/* ---- Réglages (styles) ---- */
.reglages { position: fixed; top: calc(58px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 40; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  padding: 12px; display: grid; gap: 8px; box-shadow: inset 0 0 0 1px var(--line); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.reglages[hidden] { display: none; }
.reglages .fn-art { margin: 0; }
.reglages .styles { flex-direction: column; align-items: stretch; }

/* ---- Panneau coulissant ---- */
.panneau { position: fixed; left: 0; right: 0; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: grid; grid-template-rows: auto auto 1fr; height: 0;
  background: rgba(6, 9, 13, .9); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); box-shadow: 0 -1px 0 var(--line), 0 -30px 60px rgba(0,0,0,.45);
  transition: height .38s cubic-bezier(.2,.8,.2,1); overflow: hidden; max-width: 760px; margin: 0 auto; }
.panneau[data-h="mi"] { height: 52vh; height: 52dvh; }
.panneau[data-h="plein"] { height: calc(100dvh - 52px - env(safe-area-inset-bottom, 0px) - env(safe-area-inset-top, 0px) - 64px); }
.p-poignee { background: none; border: 0; padding: 9px 0 4px; cursor: grab; display: grid; place-items: center; touch-action: none; }
.p-poignee::before { content: ""; width: 38px; height: 3px; background: var(--ink-3); }
.p-tete { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 2px 16px 10px; box-shadow: 0 1px 0 var(--line); }
.p-tete .sur { font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.p-tete h2 { margin: 3px 0 0; font-size: 20px; font-weight: 750; font-stretch: 86%; line-height: 1.15; text-wrap: balance; }
.p-corps { overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 28px; -webkit-overflow-scrolling: touch; }
.bloc { margin-top: 16px; }
.bloc-t { margin: 0 0 8px; font: 600 10px/1.2 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); }
.p-corps p { margin: 0 0 8px; font-size: 14px; line-height: 1.5; color: var(--ink); max-width: 64ch; }
.p-corps .latin { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); margin-top: 8px; }
.p-corps .note { color: var(--ink); background: color-mix(in srgb, var(--accent) 8%, transparent); padding: 10px 12px; box-shadow: inset 2px 0 0 var(--accent); }
.p-corps .avert { color: #ffd9a8; background: rgba(255, 170, 60, .08); padding: 10px 12px; box-shadow: inset 2px 0 0 #ffb347; font-size: 13px; }
.aide-txt { color: var(--ink-2) !important; font-size: 12.5px !important; }
.symptomes textarea { width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical; font: 400 15px/1.35 var(--display); color: var(--ink); background: rgba(255,255,255,.05); border: 0; padding: 12px; box-shadow: inset 0 0 0 1px var(--line); outline: none; margin-top: 6px; }
.symptomes textarea:focus { box-shadow: inset 0 0 0 1px var(--accent); }
.symptomes .compris { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 2px; }
.symptomes .compris span { font: 500 9.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); padding: 5px 7px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
.pertinence { display: inline-flex; gap: 3px; } .pertinence i { width: 6px; height: 6px; background: var(--ink-3); transform: rotate(45deg); } .pertinence i.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.sous { color: var(--ink-2) !important; font-size: 13px !important; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 8px 0; box-shadow: 0 1px 0 var(--line); font-size: 13.5px; line-height: 1.45; }
.kv .k { font: 500 9.5px/1.6 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.fn-ligne { display: grid; gap: 6px; padding: 6px 0; }
.fn-art { font: 500 9.5px/1.4 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); margin: 8px 0 2px; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puce, .tag { font: 500 12px/1.2 var(--display); color: var(--ink); background: rgba(255,255,255,.04); border: 0; padding: 7px 10px; box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; text-align: left;
  clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px); }
.tag { cursor: default; color: var(--ink-2); }
.puce.pn-p { box-shadow: inset 0 0 0 1px rgba(255, 59, 48, .8); color: var(--ink); background: rgba(255, 59, 48, .14); }
.puce.pn-s { box-shadow: inset 0 0 0 1px rgba(255, 149, 0, .6); color: var(--ink); background: rgba(255, 149, 0, .08); }
.puce.pn-st { box-shadow: inset 0 0 0 1px rgba(255, 214, 10, .45); color: var(--ink-2); }
.puce[aria-pressed="true"] { background: var(--accent); color: #05070a; box-shadow: none; }
.filtres { margin: 8px 0; }
.liste { display: grid; gap: 2px; }
.ligne-exo, .ligne-liste { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; background: rgba(255,255,255,.025); border: 0; color: var(--ink); padding: 11px 12px; cursor: pointer; box-shadow: inset 0 -1px 0 var(--line); }
.ligne-exo:hover, .ligne-liste:hover { background: rgba(255,255,255,.06); }
.le-g { display: grid; gap: 3px; min-width: 0; }
.le-nom { font-size: 14px; font-weight: 600; line-height: 1.25; }
.le-meta { font: 400 10.5px/1.4 var(--mono); color: var(--ink-2); letter-spacing: .02em; }
.le-d { display: flex; align-items: center; gap: 8px; flex: none; }
.niv { font-size: 8px; letter-spacing: 2px; color: var(--accent); }
.etoile { color: #ffd166; }
.badge { font: 500 8.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 4px 6px; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }
.badge.b-p { color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn { font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: rgba(255,255,255,.05); border: 0; padding: 11px 13px; cursor: pointer;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
.btn[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.p-corps > .btn-isoler { margin-top: 10px; }
.btn.danger { box-shadow: inset 0 0 0 1px rgba(255, 110, 110, .6); color: #ffb4b4; }
.recherche, .zone, .nouvelle input { width: 100%; box-sizing: border-box; font: 400 15px/1.2 var(--display); color: var(--ink); background: rgba(255,255,255,.05); border: 0; padding: 12px 12px; box-shadow: inset 0 0 0 1px var(--line); margin-top: 10px; outline: none; }
.champ-micro { position: relative; }
.champ-micro > .recherche, .champ-micro > textarea { padding-right: 50px !important; }
.micro { position: absolute; right: 6px; top: 6px; width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; border-radius: 50%; }
.micro svg { width: 20px; height: 20px; }
.micro[data-on] { color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); animation: ecoute 1.1s ease-in-out infinite; }
@keyframes ecoute { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 18%, transparent); } }
.btn-fort { color: var(--bg) !important; background: var(--accent) !important; box-shadow: none !important; font-weight: 700; }
.apercu-fiche { display: block; width: 100%; max-height: 60vh; object-fit: contain; margin: 6px 0 4px; box-shadow: 0 0 0 1px var(--line); }
.recherche:focus, .nouvelle input:focus { box-shadow: inset 0 0 0 1px var(--accent); }
.zone { font-size: 13px; padding: 9px 10px; margin: 0; width: auto; }
.groupe-atlas { box-shadow: 0 1px 0 var(--line); }
.groupe-atlas summary { cursor: pointer; padding: 12px 2px; font: 600 11px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); list-style: none; }
.groupe-atlas summary::before { content: "\203a"; display: inline-block; width: 14px; color: var(--accent); transition: transform .2s; }
.groupe-atlas[open] summary::before { transform: rotate(90deg); }

    repeating-linear-gradient(115deg, rgba(255, 255, 255, .012) 0 2px, transparent 2px 9px),

}

function vueInitiale() {
  const portrait = innerWidth < innerHeight;
  // en portrait : corps un peu plus petit et centré entre le titre (+ encoche de l'iPhone) et les icônes du bas
  const cible = centre.clone().add(new THREE.Vector3(0, -hauteur * (portrait ? 0.035 : 0.02), 0));
  const dist = hauteur * (portrait ? 2.95 : 1.9);
  return { cible, pos: new THREE.Vector3(centre.x, centre.y + hauteur * 0.05, centre.z + dist) };
}
function cadrer() {
  const v = vueInitiale();
  controls.target.copy(v.cible); camera.position.copy(v.pos);
  controls.minDistance = hauteur * 0.12; controls.maxDistance = hauteur * 3.2;
  controls.update();
}
// recentrer en douceur : garde l'angle de vue actuel, revient au cadrage complet
let recentrage = null;
function recentrer() {
  const v = vueInitiale(), d = camera.position.clone().sub(controls.target).normalize().multiplyScalar(v.pos.distanceTo(v.cible));
  recentrage = { t: 0, c0: controls.target.clone(), p0: camera.position.clone(), c1: v.cible, p1: v.cible.clone().add(d) };
}
document.getElementById('bCentre').onclick = recentrer;
// la cible du déplacement reste dans le volume du corps (on ne perd jamais le modèle de vue)
function bornerCible() {
  const t = controls.target, avant = t.clone();
  t.x = Math.max(centre.x - 0.35, Math.min(centre.x + 0.35, t.x));
  t.y = Math.max(bas, Math.min(bas + hauteur, t.y));
  t.z = Math.max(centre.z - 0.2, Math.min(centre.z + 0.2, t.z));
  camera.position.add(t.clone().sub(avant));
}

// Réaliste : disque calibré de 25 kg (rouge, comme en compétition) posé à plat sous les pieds, semi-transparent
function faceDisque() {
  const n = 1024, c = document.createElement('canvas'); c.width = c.height = n; const x = c.getContext('2d'), m = n / 2;
  const cercle = (r, w, col) => { x.strokeStyle = col; x.lineWidth = w; x.beginPath(); x.arc(m, m, r, 0, 6.283); x.stroke(); };

  cercle(m * 0.2, 26, 'rgba(210,214,220,.55)'); cercle(m * 0.1, 10, 'rgba(210,214,220,.4)');
  for (let k = 0; k < 3; k++) cercle(m * (0.5 + k * 0.035), 1.5, 'rgba(0,0,0,.25)');

    x.save(); x.font = `900 ${taille}px Archivo, "Helvetica Neue", Arial, sans-serif`; x.fillStyle = 'rgba(245,190,90,1)'; x.textAlign = 'center'; x.textBaseline = 'middle';

let fondNeon = null;
function texFondNeon() {
  const w = Math.round(Math.min(innerWidth * devicePixelRatio, 2000)), h = Math.round(w * innerHeight / innerWidth), cle = w + 'x' + h;
  if (fondNeon && fondNeon.cle === cle) return fondNeon.tex;
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'), M = Math.max(w, h);
  x.fillStyle = '#020305'; x.fillRect(0, 0, w, h);

  g.addColorStop(0, 'rgba(40,160,200,.30)'); g.addColorStop(0.35, 'rgba(20,90,120,.12)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, w, h);

}

// visibilité, fantômes, voiles : dépend du mode et de ce qui est allumé
// couche anatomique d'une pièce (1 = surface … 5 = la plus profonde), d'après son rang de profondeur
const bande = (p) => p.rang >= 12 ? 1 : p.rang >= 10 ? 2 : p.rang >= 8 ? 3 : p.rang >= 6 ? 4 : 5;
let couche = 2, isole = null;
function majVisuel() {
  const S = STYLES[style];
  // muscle profond allumé (mode Muscles) : ce qui le recouvre passe en transparence
  let cible = 0;
  if (mode === 'muscles') for (const [k, v] of surb) { const p = parCle.get(k)?.[0]; if (p && v >= 0.5 && p.t !== 'o' && p.couche === 'p') cible = Math.max(cible, bande(p)); }
  pieces.forEach(p => {
    const os = p.t === 'o';
    let visible = true, fantome = false;
    if (isole) { visible = os || isole.has(p.key); }
    else if (mode === 'squelette') visible = os;
    else if (mode === 'profond' && !os) {
      // couches épluchées : la couche juste au-dessus reste en fantôme pour se repérer, les autres disparaissent
      const b = bande(p);
      if (b < couche) { if (b === couche - 1) fantome = true; else visible = false; }
    } else if (cible && !os && !surb.has(p.key) && bande(p) < cible) fantome = true;
    p.fantome = fantome; p.mesh.visible = visible;
    // à découvert (isolé, couche épluchée en haut, muscle profond allumé) : forme anatomique d'origine
    if (p.formes) {
      const decouvert = (isole && isole.has(p.key)) || (mode === 'profond' && !isole && couche >= 2 && bande(p) === couche) || (cible && surb.has(p.key));
      const f = decouvert ? 'brut' : 'res';
      if (p.formes.actuelle !== f) { const g = p.mesh.geometry; g.setAttribute('position', p.formes[f][0]); g.setAttribute('normal', p.formes[f][1]); g.computeBoundingSphere(); g.computeBoundingBox(); p.formes.actuelle = f; }

// carte de chaleur des exercices : principal rouge, secondaire orange, stabilisateur jaune

const COUCHE = { s: 'Superficiel', p: 'Profond', t: 'Tendon · fascia', o: 'Os', c: 'Cartilage' };

// cadre la caméra sur des structures dans la zone visible (au-dessus du panneau) ; passe de dos si elles sont dorsales
