<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 285">
  <defs>

    <!-- Chrome corps principal -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#eaeaec"/>
      <stop offset="18%"  stop-color="#d4d4d6"/>
      <stop offset="42%"  stop-color="#949496"/>
      <stop offset="62%"  stop-color="#acacae"/>
      <stop offset="82%"  stop-color="#c6c6c8"/>
      <stop offset="100%" stop-color="#606064"/>
    </linearGradient>

    <!-- Chrome lettres : argent → rouge marque, calé sur la hauteur des anneaux -->
    <linearGradient id="letterchrome"
      x1="0" y1="72" x2="0" y2="154"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f6f6f6"/>
      <stop offset="40%"  stop-color="#d8d8da"/>
      <stop offset="100%" stop-color="#c8323c"/>
    </linearGradient>

    <!-- Chrome poignée (horizontal) -->
    <linearGradient id="chromegrip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#888890"/>
      <stop offset="38%"  stop-color="#d8d8da"/>
      <stop offset="62%"  stop-color="#dcdcde"/>
      <stop offset="100%" stop-color="#848488"/>
    </linearGradient>

    <!-- Reflet lumineux -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Halo rouge sur tout le logo -->
    <filter id="redglow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="10"
        flood-color="#c8323c" flood-opacity="0.20"/>
    </filter>

    <!-- Halo rouge sur les lettres chrome -->
    <filter id="letterglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4"
        flood-color="#c8323c" flood-opacity="0.35"/>
    </filter>

    <!-- Clip anneaux : chaque lettre est clippée dans son cercle -->
    <clipPath id="clip1"><circle cx="100" cy="113" r="41"/></clipPath>
    <clipPath id="clip2"><circle cx="213" cy="113" r="41"/></clipPath>
    <clipPath id="clip3"><circle cx="327" cy="113" r="41"/></clipPath>
    <clipPath id="clip4"><circle cx="440" cy="113" r="41"/></clipPath>

    <!-- Clip corps -->
    <clipPath id="bodyClip">
      <rect x="12" y="18" width="516" height="190" rx="40"/>
    </clipPath>

    <!-- Clip poignée -->
    <clipPath id="gripClip">
      <rect x="208" y="202" width="124" height="62" rx="13"/>
    </clipPath>

  </defs>

  <!-- Fond noir -->
  <rect width="540" height="285" fill="#0a0b0e"/>

  <!-- ─── Poignée palm rest ─── -->
  <rect x="208" y="202" width="124" height="62" rx="13" fill="url(#chromegrip)"/>
  <rect x="208" y="202" width="124" height="32" fill="url(#sheen)" clip-path="url(#gripClip)"/>
  <line x1="234" y1="215" x2="234" y2="253" stroke="#606068" stroke-width="1.5"/>
  <line x1="258" y1="215" x2="258" y2="253" stroke="#606068" stroke-width="1.5"/>
  <line x1="282" y1="215" x2="282" y2="253" stroke="#606068" stroke-width="1.5"/>
  <line x1="306" y1="215" x2="306" y2="253" stroke="#606068" stroke-width="1.5"/>

  <!-- ─── Corps principal du poing ─── -->
  <rect x="12" y="18" width="516" height="190" rx="40"
    fill="url(#chrome)" filter="url(#redglow)"/>
  <!-- Reflet haut -->
  <rect x="12" y="18" width="516" height="88" rx="40"
    fill="url(#sheen)" clip-path="url(#bodyClip)"/>
  <!-- Filet lumineux bord supérieur -->
  <rect x="58" y="19" width="395" height="3" rx="1.5"
    fill="white" fill-opacity="0.42" clip-path="url(#bodyClip)"/>

  <!-- ══════════════════════════════════════════════════
       ANNEAU 1 — Lettre  L
       La lettre remplit le cercle : son corps chrome EST l'anneau,
       l'espace noir autour = le trou pour le doigt
       ══════════════════════════════════════════════════ -->
  <circle cx="100" cy="113" r="44" fill="#101215"/>
  <circle cx="100" cy="113" r="41" fill="#0a0b0e"/>
  <text x="100" y="113"
    font-family="Impact, 'Arial Narrow Bold', sans-serif"
    font-size="80" font-weight="bold"
    fill="url(#letterchrome)"
    stroke="#3a3a42" stroke-width="1.5" paint-order="stroke"
    text-anchor="middle" dominant-baseline="central"
    filter="url(#letterglow)"
    clip-path="url(#clip1)">L</text>
  <circle cx="100" cy="113" r="43" fill="none" stroke="#bebec4" stroke-width="3.5"/>
  <circle cx="100" cy="113" r="39" fill="none" stroke="#252530" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════════
       ANNEAU 2 — Lettres EG
       ══════════════════════════════════════════════════ -->
  <circle cx="213" cy="113" r="44" fill="#101215"/>
  <circle cx="213" cy="113" r="41" fill="#0a0b0e"/>
  <text x="213" y="113"
    font-family="Impact, 'Arial Narrow Bold', sans-serif"
    font-size="44" font-weight="bold"
    fill="url(#letterchrome)"
    stroke="#3a3a42" stroke-width="1.5" paint-order="stroke"
    text-anchor="middle" dominant-baseline="central"
    filter="url(#letterglow)"
    clip-path="url(#clip2)">EG</text>
  <circle cx="213" cy="113" r="43" fill="none" stroke="#bebec4" stroke-width="3.5"/>
  <circle cx="213" cy="113" r="39" fill="none" stroke="#252530" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════════
       ANNEAU 3 — Lettres AC
       ══════════════════════════════════════════════════ -->
  <circle cx="327" cy="113" r="44" fill="#101215"/>
  <circle cx="327" cy="113" r="41" fill="#0a0b0e"/>
  <text x="327" y="113"
    font-family="Impact, 'Arial Narrow Bold', sans-serif"
    font-size="44" font-weight="bold"
    fill="url(#letterchrome)"
    stroke="#3a3a42" stroke-width="1.5" paint-order="stroke"
    text-anchor="middle" dominant-baseline="central"
    filter="url(#letterglow)"
    clip-path="url(#clip3)">AC</text>
  <circle cx="327" cy="113" r="43" fill="none" stroke="#bebec4" stroke-width="3.5"/>
  <circle cx="327" cy="113" r="39" fill="none" stroke="#252530" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════════
       ANNEAU 4 — Lettre  Y
       ══════════════════════════════════════════════════ -->
  <circle cx="440" cy="113" r="44" fill="#101215"/>
  <circle cx="440" cy="113" r="41" fill="#0a0b0e"/>
  <text x="440" y="113"
    font-family="Impact, 'Arial Narrow Bold', sans-serif"
    font-size="80" font-weight="bold"
    fill="url(#letterchrome)"
    stroke="#3a3a42" stroke-width="1.5" paint-order="stroke"
    text-anchor="middle" dominant-baseline="central"
    filter="url(#letterglow)"
    clip-path="url(#clip4)">Y</text>
  <circle cx="440" cy="113" r="43" fill="none" stroke="#bebec4" stroke-width="3.5"/>
  <circle cx="440" cy="113" r="39" fill="none" stroke="#252530" stroke-width="1.5"/>

</svg>
